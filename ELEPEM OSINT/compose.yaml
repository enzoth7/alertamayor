services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: elepem
      POSTGRES_USER: elepem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elepem -d elepem"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql+psycopg://elepem:${POSTGRES_PASSWORD:-local-development-only}@db:5432/elepem
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./registry:/data/registry:ro
      - ./exports:/data/exports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
